[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "atulya-tantra"
version = "0.1.0"
description = "Atulya Tantra — free-first AI assistant with local model inference, memory, tools, and automation"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100",
    "pydantic>=2.0",
    "uvicorn>=0.23",
    "httpx>=0.24",
    "requests>=2.31",
    "rich>=13.0",
    "psutil>=5.9",
    "cryptography>=41.0",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.6",
    "websockets>=11.0",
    "duckduckgo-search>=6.0",
    "feedparser>=6.0",
    "python-dateutil>=2.8",
    "croniter>=2.0",
]

[project.optional-dependencies]
serve = [
    "paho-mqtt>=1.6",
    "aiosmtplib>=3.0",
    "aioimaplib>=1.0",
    "edge-tts>=6.0",
]
local = [
    "torch>=2.0",
    "huggingface-hub>=0.20",
    "llama-cpp-python>=0.2.90",
    "numpy>=1.24",
]
docs = [
    "fpdf2>=2.7",
    "python-docx>=1.1",
    "python-pptx>=0.6.23",
    "pypdf>=4.0",
    "matplotlib>=3.8",
    "Pillow>=10.0",
    "openpyxl>=3.1",
]
browser = [
    "playwright>=1.40",
]
voice = [
    "faster-whisper>=1.0",
    "openai>=1.0",
    "edge-tts>=6.0",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "pytest-benchmark>=4.0",
    "ruff>=0.1",
]

[tool.setuptools.packages.find]
include = ["atulya*", "tantra*", "yantra*", "drishti*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
