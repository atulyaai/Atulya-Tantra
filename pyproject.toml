[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "atulya-tantra"
version = "0.1.0"
description = "Atulya Tantra — free-first AI assistant with local model inference, memory, tools, and automation"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100",
    "pydantic>=2.0",
    "uvicorn>=0.23",
    "httpx>=0.24",
    "requests>=2.31",
    "rich>=13.0",
    "psutil>=5.9",
    "cryptography>=41.0",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.6",
    "websockets>=11.0",
    "duckduckgo-search>=6.0",
    "feedparser>=6.0",
    "python-dateutil>=2.8",
    "croniter>=2.0",
]

[project.optional-dependencies]
serve = [
    "paho-mqtt>=1.6",
    "aiosmtplib>=3.0",
    "aioimaplib>=1.0",
    "edge-tts>=6.0",
]
# Lightweight local brain: run the tiny Qwen3-0.6B GGUF directly (no Ollama,
# no torch). This is all you need for a working self-hosted assistant.
brain = [
    "llama-cpp-python>=0.2.90",
    "huggingface-hub>=0.20",
]
docs = [
    "fpdf2>=2.7",
    "python-docx>=1.1",
    "python-pptx>=0.6.23",
    "pypdf>=4.0",
    "matplotlib>=3.8",
    "Pillow>=10.0",
    "openpyxl>=3.1",
]
browser = [
    "playwright>=1.40",
]
# Always-listening app: microphone, private local speech-to-text, offline
# voice and a tray icon (`atulya listen`).
ambient = [
    "sounddevice>=0.4",
    "numpy>=1.24",
    "faster-whisper>=1.0",
    "pyttsx3>=2.90",
    "pystray>=0.19",
    "Pillow>=10.0",
]
# Cameras: motion + person detection for "someone is at the door".
vision = [
    "opencv-python-headless>=4.8,<5",  # 5.x drops CascadeClassifier
    "numpy>=1.24",
    "rapidocr_onnxruntime>=1.3",  # eyes: read text in camera frames, locally
]
# Talking to Atulya: local speech-to-text and natural voices. Kept small on
# purpose; camera/OCR live in "vision".
voice = [
    "faster-whisper>=1.0",
    "edge-tts>=6.0",
]
# Optional: lets Atulya type and press keys for you (still off until ATULYA_PC_CONTROL=on).
control = [
    "pyautogui>=0.9",
]
# A trained wake-word model (ATULYA_WAKE_MODEL) and the natural offline voice (ATULYA_PIPER_MODEL, needs the
# `piper` program on PATH).
wake = [
    "openwakeword>=0.6",
    "piper-tts>=1.2",
]
dev = [
    "numpy>=1.24",
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "pytest-benchmark>=4.0",
    "ruff>=0.1",
]

[project.scripts]
atulya = "atulya.cli:main"
atulya-listen = "atulya.shruti.cli:main"

[tool.setuptools.packages.find]
include = ["atulya*"]

[tool.setuptools.package-data]
"atulya" = ["upakaran_profiles.json"]
"atulya.yantra" = ["mcp_servers.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["pariksha"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501", "E402"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # re-exports
