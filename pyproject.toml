[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "atulya-tantra"
dynamic = ["version"]
description = "Atulya Tantra — free-first AI assistant with local model inference, memory, tools, and automation"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100",
    "pydantic>=2.0",
    "uvicorn>=0.23",
    "httpx>=0.24",
    "requests>=2.31",
    "rich>=13.0",
    "psutil>=5.9",
    "cryptography>=41.0",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.6",
    "websockets>=11.0",
    "ddgs>=9.0",
    "feedparser>=6.0",
    "python-dateutil>=2.8",
    "croniter>=2.0",
    "paho-mqtt>=2.0",
    "watchdog>=4.0",
    "twilio>=9.0",
]

[project.optional-dependencies]
serve = [
    "aiosmtplib>=3.0",
    "aioimaplib>=1.0",
    "edge-tts>=6.0",
]
push = [
    "pywebpush>=2.0",
]
# Lightweight local brain: run the tiny Qwen3-0.6B GGUF directly (no Ollama,
# no torch). This is all you need for a working self-hosted assistant.
brain = [
    "llama-cpp-python>=0.2.90",
    "huggingface-hub>=0.20",
]
docs = [
    "fpdf2>=2.7",
    "python-docx>=1.1",
    "python-pptx>=0.6.23",
    "pypdf>=4.0",
    "matplotlib>=3.8",
    "Pillow>=10.0",
    "openpyxl>=3.1",
]
browser = [
    "playwright>=1.40",
]
# Always-listening app: microphone, private local speech-to-text, offline
# voice and a tray icon (`atulya listen`).
ambient = [
    "sounddevice>=0.4",
    "numpy>=1.24",
    "faster-whisper>=1.0",
    "pyttsx3>=2.90",
    "pystray>=0.19",
    "Pillow>=10.0",
    "webrtcvad>=2.0",
    "soundfile>=0.12",
]
# Voice identity: speaker embeddings + diarization (optional extra).
voice_id = [
    "speechbrain>=1.0",
    "torchaudio>=2.0",
    "pyannote.audio>=3.0",
]
# Termux wake word listener (optional extra for phone).
phone_listener = [
    "openwakeword>=0.6",
    "onnxruntime>=1.16",
    "numpy>=1.24",
    "sounddevice>=0.4",
]
# Cameras: motion + person detection for "someone is at the door".
vision = [
    "opencv-python-headless>=4.8,<5",  # 5.x drops CascadeClassifier
    "numpy>=1.24",
    "rapidocr_onnxruntime>=1.3",  # eyes: read text in camera frames, locally
]
# Talking to Atulya: local speech-to-text and natural voices. Kept small on
# purpose; camera/OCR live in "vision".
voice = [
    "faster-whisper>=1.0",
    "edge-tts>=6.0",
]
# Optional: lets Atulya type and press keys for you (still off until ATULYA_PC_CONTROL=on).
control = [
    "pyautogui>=0.9",
]
# Optional: real semantic embeddings for vector memory (RAG).
embeddings = [
    "sentence-transformers>=3.0",
    "torch>=2.0",
]

# A trained wake-word model (ATULYA_WAKE_MODEL) and the natural offline voice (ATULYA_PIPER_MODEL, needs the
# `piper` program on PATH).
wake = [
    "openwakeword>=0.6",
    "piper-tts>=1.2",
]
dev = [
    "numpy>=1.24",
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "pytest-benchmark>=4.0",
    # tests/test_examples.py reads the notebooks in examples/; it was never
    # listed, so `pip install -e ".[dev]" && pytest` died at collection on a
    # fresh machine while working everywhere the module happened to be
    # installed already.
    "nbformat>=5.0",
    "ruff>=0.1",
    "twilio>=9.0",
]

[project.scripts]
atulya = "atulya.cli:main"
atulya-listen = "atulya.ambient:main"
atulya-watchdog = "atulya.watchdog:main"
atulya-ambient-phone = "atulya.phone_listener:main"

[tool.setuptools.dynamic]
version = {attr = "atulya.__version__"}

[tool.setuptools.packages.find]
include = ["atulya*"]

[tool.setuptools.package-data]
"atulya" = ["device_profiles.json", "mcp_servers.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501", "E402"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # re-exports
