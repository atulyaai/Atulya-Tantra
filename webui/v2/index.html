<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Atulya · Core v2</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:system-ui,sans-serif;color:#e8f4ff}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#core{width:100%;height:100%;object-fit:contain;transition:opacity .35s}
#status{position:fixed;top:1rem;left:1rem;font-size:.8rem;letter-spacing:.12em;color:#69eaff;opacity:.8}
</style>
</head>
<body>
<div id="status">IDLE</div>
<div id="stage"><img id="core" src="assets/idle.jpg" alt="core"></div>
<script>
const core = document.getElementById("core");
const status = document.getElementById("status");
const frames = {
  idle: "assets/idle.jpg",
  listening: "assets/listening.jpg",
  thinking: "assets/thinking.jpg",
  speaking: "assets/speaking.jpg",
  overdrive: "assets/overdrive.jpg",
  vision: "assets/vision.jpg"
};
function setState(name) {
  const key = frames[name] ? name : "idle";
  status.textContent = key.toUpperCase();
  if (core.src.endsWith(frames[key])) return;
  core.style.opacity = "0";
  setTimeout(() => { core.src = frames[key]; core.style.opacity = "1"; }, 160);
}
// Same hook v1 uses
window.__HUM_SET_STATE = setState;
window.addEventListener("atulya:state", (e) => setState(e.detail));
// Standalone demo cycle if opened directly
if (location.search.includes("demo")) {
  const seq = ["idle","listening","thinking","speaking","overdrive","vision","idle"];
  let i = 0;
  setInterval(() => setState(seq[i++ % seq.length]), 1800);
}
setState("idle");
</script>
</body>
</html>
