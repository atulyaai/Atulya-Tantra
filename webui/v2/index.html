<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Atulya · Core v2</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:system-ui,sans-serif;color:#e8f4ff}
#stage{position:fixed;inset:0}
#core{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .6s ease}
#fx{position:absolute;inset:0;pointer-events:none}
#status{position:fixed;top:1rem;left:1rem;font-size:.7rem;letter-spacing:.16em;color:#69eaff;opacity:.6}
</style>
</head>
<body>
<div id="status">ASSEMBLING</div>
<div id="stage">
  <img id="core" alt="core">
  <canvas id="fx"></canvas>
</div>
<script>
const core = document.getElementById("core");
const status = document.getElementById("status");
const canvas = document.getElementById("fx");
const ctx = canvas.getContext("2d");

const assembly = ["assets/01_dot.jpg","assets/02_aurora.jpg","assets/03_prismatic.jpg","assets/04_chassis.jpg"];
const live = {idle:"assets/05_idle.jpg",listening:"assets/06_listening.jpg",thinking:"assets/07_thinking.jpg",speaking:"assets/08_speaking.jpg",overdrive:"assets/09_overdrive.jpg",vision:"assets/10_vision.jpg"};

let phase = "assembly";
let energy = 0.2;
const particles = [];

function resize(){canvas.width=innerWidth;canvas.height=innerHeight}
addEventListener("resize", resize); resize();

function show(src, label) {
  status.textContent = label;
  core.style.opacity = "0";
  setTimeout(() => { core.src = src; core.onload = () => core.style.opacity = "1"; }, 200);
}

function setState(name) {
  phase = name;
  energy = name === "speaking" || name === "overdrive" ? 0.8 : name === "thinking" ? 0.55 : name === "listening" ? 0.4 : 0.25;
  show(live[name] || live.idle, name.toUpperCase());
}

function spawn() {
  if (particles.length > 80) return;
  const cx = canvas.width / 2, cy = canvas.height / 2;
  const a = Math.random() * Math.PI * 2;
  const r = 80 + Math.random() * 220;
  particles.push({
    x: cx + Math.cos(a) * r,
    y: cy + Math.sin(a) * r,
    vx: (Math.random() - 0.5) * energy * 2,
    vy: (Math.random() - 0.5) * energy * 2,
    life: 1,
    size: 1 + Math.random() * 2.5
  });
}

function tick() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (phase !== "assembly") spawn();
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy; p.life -= 0.012;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    ctx.globalAlpha = p.life * 0.6;
    ctx.fillStyle = phase === "overdrive" ? "#ffcc66" : phase === "vision" ? "#ffe08a" : "#69eaff";
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  requestAnimationFrame(tick);
}
tick();

let i = 0;
function assemble() {
  if (i >= assembly.length) { setState("idle"); window.__HUM_SET_STATE = setState; return; }
  show(assembly[i], "ASSEMBLING");
  i++;
  setTimeout(assemble, 1600);
}
assemble();

if (location.search.includes("demo")) {
  setTimeout(() => {
    const seq = ["idle","listening","thinking","speaking","overdrive","vision","idle"];
    let n = 0;
    setInterval(() => setState(seq[n++ % seq.length]), 2200);
  }, assembly.length * 1600 + 400);
}
</script>
</body>
</html>
