<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Atulya · Core v2</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:system-ui,sans-serif;color:#e8f4ff}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#core{width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .5s ease}
#status{position:fixed;top:1rem;left:1rem;font-size:.75rem;letter-spacing:.14em;color:#69eaff;opacity:.7}
</style>
</head>
<body>
<div id="status">ASSEMBLING</div>
<div id="stage"><img id="core" alt="core"></div>
<script>
const core = document.getElementById("core");
const status = document.getElementById("status");

const assembly = [
  "assets/01_dot.jpg",
  "assets/02_aurora.jpg",
  "assets/03_prismatic.jpg",
  "assets/04_chassis.jpg"
];
const live = {
  idle: "assets/05_idle.jpg",
  listening: "assets/06_listening.jpg",
  thinking: "assets/07_thinking.jpg",
  speaking: "assets/08_speaking.jpg",
  overdrive: "assets/09_overdrive.jpg",
  vision: "assets/10_vision.jpg"
};

function show(src, label) {
  status.textContent = label;
  core.style.opacity = "0";
  setTimeout(() => {
    core.src = src;
    core.onload = () => { core.style.opacity = "1"; };
  }, 180);
}

function setState(name) {
  const src = live[name] || live.idle;
  show(src, name.toUpperCase());
}

// Assembly sequence on first load
let i = 0;
function assemble() {
  if (i >= assembly.length) {
    setState("idle");
    window.__HUM_SET_STATE = setState;
    window.addEventListener("atulya:state", (e) => setState(e.detail));
    return;
  }
  show(assembly[i], "ASSEMBLING " + (i + 1));
  i++;
  setTimeout(assemble, 1400);
}
assemble();

// Demo mode
if (location.search.includes("demo")) {
  setTimeout(() => {
    const seq = ["idle","listening","thinking","speaking","overdrive","vision","idle"];
    let n = 0;
    setInterval(() => setState(seq[n++ % seq.length]), 2000);
  }, assembly.length * 1400 + 500);
}
</script>
</body>
</html>
