<svg viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Atulya Tantra architecture</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#64748b"/>
    </marker>
    <style>
      .box{fill:#0f172a;stroke:#334155;stroke-width:1.5}
      .core{fill:#1e1b4b;stroke:#818cf8;stroke-width:2}
      .t{fill:#e2e8f0;font-size:15px;font-weight:600}
      .s{fill:#94a3b8;font-size:12px}
      .h{fill:#a5b4fc;font-size:13px;font-weight:700;letter-spacing:1px}
      .l{stroke:#64748b;stroke-width:1.5;fill:none}
    </style>
  </defs>
  <rect width="900" height="520" rx="14" fill="#020617"/>
  <text x="450" y="38" text-anchor="middle" class="t" style="font-size:20px">Atulya Tantra</text>

  <text x="40" y="78" class="h">DRISHTI — HOW YOU TALK TO IT</text>
  <rect class="box" x="40" y="90" width="190" height="64" rx="10"/><text x="135" y="118" text-anchor="middle" class="t">Web &amp; phone app</text><text x="135" y="138" text-anchor="middle" class="s">hologram head, galaxy map</text>
  <rect class="box" x="255" y="90" width="190" height="64" rx="10"/><text x="350" y="118" text-anchor="middle" class="t">Always-on listener</text><text x="350" y="138" text-anchor="middle" class="s">wake word, Hindi, barge-in</text>
  <rect class="box" x="470" y="90" width="190" height="64" rx="10"/><text x="565" y="118" text-anchor="middle" class="t">Channels</text><text x="565" y="138" text-anchor="middle" class="s">Telegram, email, webhooks</text>
  <rect class="box" x="685" y="90" width="175" height="64" rx="10"/><text x="772" y="118" text-anchor="middle" class="t">OpenAI-style API</text><text x="772" y="138" text-anchor="middle" class="s">/v1/models, /api/chat</text>

  <path class="l" marker-end="url(#a)" d="M450 160V198"/>

  <text x="40" y="194" class="h">ATULYA — THE BRAIN</text>
  <rect class="core" x="40" y="204" width="820" height="124" rx="12"/>
  <rect class="box" x="58" y="222" width="180" height="88" rx="10"/><text x="148" y="250" text-anchor="middle" class="t">Kernel</text><text x="148" y="270" text-anchor="middle" class="s">perceive → decide → act</text><text x="148" y="288" text-anchor="middle" class="s">→ remember → react</text>
  <rect class="box" x="254" y="222" width="180" height="88" rx="10"/><text x="344" y="250" text-anchor="middle" class="t">Brain tiers</text><text x="344" y="270" text-anchor="middle" class="s">local Qwen 0.6B – 4B</text><text x="344" y="288" text-anchor="middle" class="s">cloud failover</text>
  <rect class="box" x="450" y="222" width="180" height="88" rx="10"/><text x="540" y="250" text-anchor="middle" class="t">Memory</text><text x="540" y="270" text-anchor="middle" class="s">tree, reflection, vectors</text><text x="540" y="288" text-anchor="middle" class="s">Obsidian export</text>
  <rect class="box" x="646" y="222" width="196" height="88" rx="10"/><text x="744" y="250" text-anchor="middle" class="t">Safety &amp; audit</text><text x="744" y="270" text-anchor="middle" class="s">confirm risky actions</text><text x="744" y="288" text-anchor="middle" class="s">every tool call logged</text>

  <path class="l" marker-end="url(#a)" d="M450 334V372"/>

  <text x="40" y="368" class="h">YANTRA — WHAT IT CAN DO</text>
  <rect class="box" x="40" y="378" width="156" height="110" rx="10"/><text x="118" y="406" text-anchor="middle" class="t">Assistant tools</text><text x="118" y="428" text-anchor="middle" class="s">reminders, calendar</text><text x="118" y="446" text-anchor="middle" class="s">email, weather</text><text x="118" y="464" text-anchor="middle" class="s">briefing, tracking</text>
  <rect class="box" x="210" y="378" width="156" height="110" rx="10"/><text x="288" y="406" text-anchor="middle" class="t">Media &amp; PC</text><text x="288" y="428" text-anchor="middle" class="s">play music, volume</text><text x="288" y="446" text-anchor="middle" class="s">open apps, type</text><text x="288" y="464" text-anchor="middle" class="s">(off until enabled)</text>
  <rect class="box" x="380" y="378" width="156" height="110" rx="10"/><text x="458" y="406" text-anchor="middle" class="t">Senses</text><text x="458" y="428" text-anchor="middle" class="s">camera, motion</text><text x="458" y="446" text-anchor="middle" class="s">OCR eyes</text><text x="458" y="464" text-anchor="middle" class="s">home sensors</text>
  <rect class="box" x="550" y="378" width="156" height="110" rx="10"/><text x="628" y="406" text-anchor="middle" class="t">Home &amp; devices</text><text x="628" y="428" text-anchor="middle" class="s">Home Assistant</text><text x="628" y="446" text-anchor="middle" class="s">MQTT</text><text x="628" y="464" text-anchor="middle" class="s">device control</text>
  <rect class="box" x="720" y="378" width="140" height="110" rx="10"/><text x="790" y="406" text-anchor="middle" class="t">Web &amp; docs</text><text x="790" y="428" text-anchor="middle" class="s">browser, search</text><text x="790" y="446" text-anchor="middle" class="s">Google, MCP</text><text x="790" y="464" text-anchor="middle" class="s">office files</text>
</svg>
