services:
  atulya:
    build: .
    env_file: .env
    environment:
      ATULYA_HOST: 0.0.0.0
      ATULYA_PORT: "8501"
      ATULYA_HTTPS: "off"
      ATULYA_JWT_SECRET_FILE: /app/data/jwt_secret.key
    volumes:
      - ./data:/app/data
    ports:
      - "${ATULYA_DOCKER_BIND:-127.0.0.1}:${ATULYA_PORT:-8501}:8501"
    restart: unless-stopped

  cloudflared:
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token ${CF_TUNNEL_TOKEN:-}
    environment:
      CF_TUNNEL_TOKEN: ${CF_TUNNEL_TOKEN}
    depends_on:
      - atulya
    restart: unless-stopped
