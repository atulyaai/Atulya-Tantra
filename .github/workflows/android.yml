name: Android APK

# Builds the signed Atulya release APK on GitHub's machines (Android SDK preinstalled).
# Every change to android/ on main is published automatically as the latest GitHub Release, so the in-app
# updater (/api/app/latest) offers it. A tag like v1.0.0 publishes that exact version instead.
on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Clean versions: each automatic release bumps the middle number (0.4.0, 0.5.0, ...).
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF#refs/tags/v}"; else
            LAST=$(gh release list --limit 200 --json tagName --jq '.[].tagName' | sort -V | tail -1)
            LAST=${LAST:-v0.3.0}
            MINOR=$(echo "${LAST#v}" | cut -d. -f2)
            V="0.$((MINOR + 1)).0"
          fi
          echo "VERSION=$V" >> "$GITHUB_ENV"
      - name: Build signed release
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/atulya-release.p12"
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/atulya-release.p12"
          gradle --no-daemon assembleRelease bundleRelease -PversionName="$VERSION" -PversionCode="$GITHUB_RUN_NUMBER"
          mkdir -p ../dist && cp app/build/outputs/apk/release/app-release.apk "../dist/Atulya-$VERSION.apk"
          cp app/build/outputs/bundle/release/app-release.aab "../dist/Atulya-$VERSION.aab"
          rm -f "$RUNNER_TEMP/atulya-release.p12"
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          "$APKSIGNER" verify --print-certs "../dist/Atulya-$VERSION.apk" | grep -i "SHA-256"
      - uses: actions/upload-artifact@v4
        with:
          name: Atulya-${{ env.VERSION }}
          path: |
            dist/Atulya-*.apk
            dist/Atulya-*.aab
      - name: Build emulator test copy (screenshots allowed)
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/atulya-release.p12"
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/atulya-release.p12"
          gradle --no-daemon assembleRelease -PversionName="$VERSION" -PversionCode="$GITHUB_RUN_NUMBER" -PallowScreenshots=true
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/smoke.apk"
          rm -f "$RUNNER_TEMP/atulya-release.p12"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Emulator smoke test (install, launch, rotate, resume, app link)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: sh tools/android_smoke.sh "$RUNNER_TEMP/smoke.apk" dist/smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-${{ env.VERSION }}
          path: dist/smoke
      - name: APK size
        run: echo "APK $(du -k dist/*.apk | cut -f1) KB" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v$VERSION" dist/Atulya-*.apk dist/Atulya-*.aab --title "Atulya $VERSION" --notes "Signed Android build of Atulya. Install the .apk on your phone; the .aab is for Google Play."
