name: Android APK

# Builds the signed Atulya release APK on GitHub's machines (Android SDK preinstalled).
# Every change to android/ on main is published automatically as the latest GitHub Release, so the in-app
# updater (/api/app/latest) offers it. A tag like v1.0.0 publishes that exact version instead.
on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml", "tools/android_ui_test.py"]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Automatic releases bump only the last number (0.5.1, 0.5.2, ...); a milestone tag (v0.6.0) moves the middle.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF#refs/tags/v}"; else
            LAST=$(gh release list --limit 200 --json tagName --jq '.[].tagName' | sort -V | tail -1)
            LAST=${LAST:-v0.3.0}
            MINOR=$(echo "${LAST#v}" | cut -d. -f2)
            PATCH=$(echo "${LAST#v}" | cut -d. -f3)
            V="0.${MINOR}.$((PATCH + 1))"
          fi
          echo "VERSION=$V" >> "$GITHUB_ENV"
      - name: Build signed release
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/atulya-release.p12"
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/atulya-release.p12"
          gradle --no-daemon assembleRelease bundleRelease -PversionName="$VERSION" -PversionCode="$GITHUB_RUN_NUMBER"
          mkdir -p ../dist && cp app/build/outputs/apk/release/app-release.apk "../dist/Atulya-$VERSION.apk"
          cp app/build/outputs/bundle/release/app-release.aab "../dist/Atulya-$VERSION.aab"
          rm -f "$RUNNER_TEMP/atulya-release.p12"
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          "$APKSIGNER" verify --print-certs "../dist/Atulya-$VERSION.apk" | grep -i "SHA-256"
      - uses: actions/upload-artifact@v4
        with:
          name: Atulya-${{ env.VERSION }}
          path: |
            dist/Atulya-*.apk
            dist/Atulya-*.aab
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Private Atulya server for the UI test (emulator reaches it at 10.0.2.2)
        env:
          ATULYA_SKIP_MODELS: "1"
          ATULYA_PRELOAD: "0"
        run: |
          sh install.sh --no-start
          PW="ci$(openssl rand -hex 12)"
          echo "::add-mask::$PW"
          echo "TEST_PASSWORD=$PW" >> "$GITHUB_ENV"
          export ATULYA_DATA_DIR="$RUNNER_TEMP/atulya-data" ATULYA_TEST_HOSTS="10.0.2.2"
          echo "$PW" | .venv/bin/python -m atulya.cli set-password --user admin
          nohup .venv/bin/python -m atulya.cli serve > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 1 60); do curl -fs -o /dev/null -H "Host: 10.0.2.2:8501" http://127.0.0.1:8501/api/health && break; sleep 2; done
          curl -fs -H "Host: 10.0.2.2:8501" http://127.0.0.1:8501/api/health
      - name: Build UI-test copy (points at the private server, screenshots allowed)
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/atulya-release.p12"
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/atulya-release.p12"
          gradle --no-daemon assembleRelease -PversionName="$VERSION" -PversionCode="$GITHUB_RUN_NUMBER"             -PallowScreenshots=true -PtestServer=1 -PatulyaUrl=http://10.0.2.2:8501
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/uitest.apk"
          rm -f "$RUNNER_TEMP/atulya-release.p12"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Emulator UI test (sign in, chat layout, hide chat, menu, rotation, reopen, crashes, memory)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: python3 tools/android_ui_test.py "$RUNNER_TEMP/uitest.apk" dist/smoke "$TEST_PASSWORD"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-${{ env.VERSION }}
          path: dist/smoke
      - name: APK size
        run: echo "APK $(du -k dist/*.apk | cut -f1) KB" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v$VERSION" dist/Atulya-*.apk dist/Atulya-*.aab --title "Atulya $VERSION" --notes "Signed Android build of Atulya. Install the .apk on your phone; the .aab is for Google Play."
