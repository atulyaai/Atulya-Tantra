name: Android APK

# Builds the signed Atulya release APK on GitHub's machines (Android SDK preinstalled).
# Push a tag like v1.0.0 to publish it as a GitHub Release.
on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF#refs/tags/v}"; else V="1.0.${GITHUB_RUN_NUMBER}"; fi
          echo "VERSION=$V" >> "$GITHUB_ENV"
      - name: Build signed release
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/atulya-release.p12"
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/atulya-release.p12"
          gradle --no-daemon assembleRelease bundleRelease -PversionName="$VERSION" -PversionCode="$GITHUB_RUN_NUMBER"
          mkdir -p ../dist && cp app/build/outputs/apk/release/app-release.apk "../dist/Atulya-$VERSION.apk"
          cp app/build/outputs/bundle/release/app-release.aab "../dist/Atulya-$VERSION.aab"
          rm -f "$RUNNER_TEMP/atulya-release.p12"
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "../dist/Atulya-$VERSION.apk" | grep -i "SHA-256"
      - uses: actions/upload-artifact@v4
        with:
          name: Atulya-${{ env.VERSION }}
          path: |
            dist/Atulya-*.apk
            dist/Atulya-*.aab
      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v$VERSION" dist/Atulya-*.apk dist/Atulya-*.aab --title "Atulya $VERSION" --notes "Signed Android build of Atulya. Install the .apk on your phone; the .aab is for Google Play."
