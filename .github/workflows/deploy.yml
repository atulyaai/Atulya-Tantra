name: Deploy to server

# After the clean-machine tests pass on main, the server updates itself:
# pull, install changed dependencies, restart, health check, automatic rollback on failure.
# The deploy key can only run tools/deploy_server.sh on the server (forced command).
on:
  workflow_run:
    workflows: ["Install and test (clean machines)"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency: deploy-server

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Deploy
        env:
          KEY: ${{ secrets.SERVER_DEPLOY_KEY }}
          HOST: ${{ secrets.SERVER_HOST }}
        run: |
          install -m 600 /dev/null ~/deploy_key
          printf '%s\n' "$KEY" > ~/deploy_key
          ssh -i ~/deploy_key -o StrictHostKeyChecking=accept-new -o BatchMode=yes "ubuntu@$HOST" deploy
          rm -f ~/deploy_key
          # deploy_server.sh health-checks on the server itself and rolls back on failure.
          # (A public check from GitHub is blocked by Cloudflare's bot protection, by design.)
