name: Install and test (clean machines)

# Every push: run the real one-line installer on fresh Windows, Ubuntu and macOS
# machines, run the test suite, start the server and check it answers.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      ATULYA_SKIP_MODELS: "1"   # packages only; multi-GB models are not needed to prove the install
      ATULYA_PRELOAD: "0"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - name: One-click install (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./install.ps1 -NoStart

      - name: One-click install (Linux / macOS)
        if: runner.os != 'Windows'
        run: sh install.sh --no-start

      - name: Locate the project Python
        shell: bash
        run: |
          if [ -x .venv/Scripts/python.exe ]; then echo "PY=.venv/Scripts/python.exe" >> "$GITHUB_ENV"; else echo "PY=.venv/bin/python" >> "$GITHUB_ENV"; fi

      - name: Test suite
        shell: bash
        run: |
          "$PY" -m pip install -q -r requirements-dev.lock.txt
          "$PY" -m pytest -q
          "$PY" -m ruff check .

      - name: Start the server and check it answers
        shell: bash
        run: |
          "$PY" -m atulya.cli doctor
          "$PY" -m atulya.cli serve > server.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8501/api/health -H "Host: localhost"; then echo; break; fi
            sleep 2
          done
          echo "---- server log ----"; cat server.log; echo "--------------------"
          curl -fsS -H 'Host: localhost' http://127.0.0.1:8501/api/health | grep -q '"status":"ok"'
          curl -fsS -H 'Host: localhost' http://127.0.0.1:8501/ | grep -q "system-dashboard"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8501/api/chat -H 'Host: localhost' -H 'Content-Type: application/json' -d '{"messages":[{"role":"user","content":"hi"}],"conversation_id":"ci"}')" = "401"
          echo "Server healthy; WebUI served; chat requires sign-in."

      - name: Server log on failure
        if: failure()
        shell: bash
        run: cat server.log || true
